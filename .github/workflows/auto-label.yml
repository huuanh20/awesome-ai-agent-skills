name: Auto Label Issues

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue || context.payload.pull_request;
            const body = (issue.body || '').toLowerCase();
            const title = (issue.title || '').toLowerCase();
            const labels = [];

            // Auto-label based on content
            if (title.includes('[bug]') || body.includes('bug') || body.includes("doesn't work")) {
              labels.push('bug');
            }
            if (title.includes('[feature]') || body.includes('feature') || body.includes('suggestion')) {
              labels.push('enhancement');
            }
            if (body.includes('cursor')) labels.push('cursor');
            if (body.includes('claude')) labels.push('claude');
            if (body.includes('gemini')) labels.push('gemini');
            if (body.includes('copilot')) labels.push('copilot');
            if (body.includes('documentation') || body.includes('docs')) labels.push('documentation');
            if (context.payload.pull_request) labels.push('pull-request');

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labels
              });
            }
